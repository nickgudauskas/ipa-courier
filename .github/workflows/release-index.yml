name: Update release index

# Publishes releases.json (the latest release of every catalog project) and
# each project's preview image to the release-index branch, so IPA Courier needs
# a few CDN downloads instead of one GitHub API call and one rate-limited image
# request per project. Also checks every catalog entry and keeps a
# "Catalog health check" issue open while any project has a problem.

on:
  schedule:
    # Hourly, off the top of the hour. GitHub drops many scheduled runs when it's
    # busy (every 3 hours ran only about twice a day), so ask often. A run takes
    # about 20 seconds and replaces the branch with a single commit.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Resources/catalog.json, scripts/build-release-index.py]

permissions:
  contents: write
  issues: write

concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Reuse images already published
        run: |
          mkdir -p out/images
          if git fetch -q --depth=1 origin release-index; then
            git --work-tree=out checkout FETCH_HEAD -- images 2>/dev/null || true
            git reset -q
          fi
          echo "$(ls out/images | wc -l) images reused"

      - name: Build releases.json and fetch new images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-release-index.py --images out/images --health health.md > out/releases.json

      - name: Publish to the release-index branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b release-index
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add releases.json images
          git commit -q -m "Update release index"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release-index

      - name: Report catalog problems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Catalog health check"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -s health.md ]; then
            if [ -z "$number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file health.md
            else
              # Only edit when the problem list changed (ignore the timestamp line).
              old=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep '^- ' || true)
              new=$(grep '^- ' health.md || true)
              if [ "$old" != "$new" ]; then
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file health.md
              fi
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every catalog project resolves again."
          fi
