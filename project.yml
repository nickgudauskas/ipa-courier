name: IPACourier
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  IPACourier:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/ProvisioningStub
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: IPA Courier
        CFBundleName: IPA Courier
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa]
    settings:
      base:
        PRODUCT_NAME: IPA Courier
        PRODUCT_BUNDLE_IDENTIFIER: local.ipacourier.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
